# GençTek ters vekil — /etc/nginx/conf.d/genctek.conf
#
# NOT: aiotechs.cloud sunucusunda BU DOSYA KULLANILMIYOR. Orada Apache var ve
# yapılandırma DirectAdmin'in cust_httpd dosyasına yazıldı (bkz. DAGITIM.md
# Bölüm 13). Bu dosya, nginx'li bir sunucuya taşınırsa diye duruyor.
#
# ALAN_ADI yazan yerleri kendi alan adınızla değiştirin, sonra:
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS bloğu ve yönlendirme certbot tarafından eklenir:
#   sudo certbot --nginx -d ALAN_ADI
# Bu yüzden aşağıda yalnızca 80 portu tanımlı; certbot 443'ü kendisi yazar.
#
# GÜVENLİK BAŞLIKLARI BURADA YOK. Bilinçli: X-Frame-Options, nosniff ve
# Referrer-Policy next.config.ts içinde tanımlı. Vekil yapılandırması sunucu
# taşındığında geride kalır, başlıklar derlemeyle birlikte taşınır. Aynı başlığı
# iki yerde tanımlamak da yinelenen header üretir.

# WebSocket yükseltmesi için gereken eşleme. /etc/nginx/nginx.conf içindeki
# http bloğunda zaten tanımlıysa bu üç satırı silin — iki kez tanımlamak
# "duplicate map" hatası verir.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream genctek_uygulama {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ALAN_ADI;

    # Faaliyet eki yükleme sınırı sistem ayarlarından gelir (varsayılan belge
    # 10 MB). Vekil sınırı bunun üstünde olmalı, aksi halde uygulama kendi
    # anlamlı hata mesajını veremeden nginx 413 döner.
    client_max_body_size 12m;

    # Next.js sunucu eylemleri (form gönderimleri) yavaş bir veritabanı
    # sorgusunda 60 saniyeyi bulabilir.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    access_log /var/log/nginx/genctek-access.log;
    error_log  /var/log/nginx/genctek-error.log;

    # Derlemeyle gelen değişmez varlıklar; içerik karması adlarında olduğu için
    # uzun süre önbelleğe alınabilir.
    location /_next/static/ {
        proxy_pass http://genctek_uygulama;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://genctek_uygulama;
        proxy_http_version 1.1;

        # Uygulama gerçek istemci adresini erişim loguna yazar; vekil arkasında
        # bu başlıklar olmadan herkes 127.0.0.1 görünür (KVKK denetimi için
        # "hangi kullanıcı nereden baktı" bilgisi gerekiyor).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
